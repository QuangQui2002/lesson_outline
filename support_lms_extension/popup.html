<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="styles.css" />
  <title>LMS TVU Helper</title>
</head>
<body class="popup-body popup-body--compact">
  <section class="popup-card">
    <div class="popup-hero popup-hero--compact">
      <div class="popup-icon">TVU</div>
      <div class="popup-title-block">
        <span class="popup-chip">Local helper</span>
        <h1>LMS TVU Helper</h1>
        <p>Lưu video bài học và import câu hỏi review.</p>
      </div>
    </div>

    <div class="popup-actions">
      <button id="saveVideos" class="popup-action-btn popup-action-btn--video" type="button" disabled title="Chỉ bật khi đang ở trang /course/... hoặc /course/.../video/...">
        <span>▶</span>
        <strong>Lưu video</strong>
      </button>
      <button id="importQuestions" class="popup-action-btn popup-action-btn--question" type="button" disabled title="Chỉ bật khi đang ở trang /attempt/.../review">
        <span>?</span>
        <strong>Lấy câu hỏi</strong>
      </button>
    </div>

    <div class="popup-mini-info">
      <span id="currentPageType">Đang kiểm tra trang...</span>
      <small>Speed/PiP tự hiện trong video LMS khi extension thấy thẻ video.</small>
    </div>

    <p id="popupStatus" class="popup-status" data-type="info">
      <span class="popup-status-dot"></span>
      <span>Sẵn sàng.</span>
    </p>
  </section>
  <script src="popup.js"></script>
</body>
</html>
